name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: josefinee-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-build-package:
    name: Validate, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: josefinee_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d josefinee_store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/josefinee_store?schema=public
      AUTH_SECRET: ci-only-auth-secret-012345678901234567890123456789
      ORDER_OUTBOX_SECRET: ci-only-outbox-secret-012345678901234567890123456789
      RETENTION_JOB_SECRET: ci-only-retention-secret-012345678901234567890123456789
      APP_URL: https://ci.example.invalid/
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: ci-bucket
      STORAGE_ACCESS_KEY: ci-access-key
      STORAGE_SECRET_KEY: ci-secret-key
      STORAGE_PUBLIC_HOST: https://cdn.example.invalid

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Keep NODE_ENV=production for runtime configuration while installing
      # devDependencies needed by Prisma seed, TypeScript, ESLint, and Vitest.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed CI fixtures
        env:
          SEED_ADMIN_EMAIL: ci-admin@example.test
          SEED_ADMIN_PASSWORD: CI-Admin-Password-2026-Strong!
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build standalone application
        run: npm run build

      - name: Prepare standalone runtime files
        run: |
          if [ -d public ]; then cp -R public .next/standalone/public; fi
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Production HTTP smoke tests
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
        run: |
          node .next/standalone/server.js > /tmp/josefinee-store.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:3000 npm run smoke:production

      - name: Package standalone deployment artifact
        run: |
          tar -czf "josefinee-standalone-${GITHUB_SHA}.tar.gz" \
            -C .next/standalone .

      - name: Upload standalone deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: josefinee-standalone-${{ github.sha }}
          path: josefinee-standalone-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
