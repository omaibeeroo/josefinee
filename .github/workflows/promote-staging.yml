name: Promote staging to production

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [staging]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Promote tested staging commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Confirm staging has not advanced since CI
        run: |
          staging_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/staging" --jq '.object.sha')"
          if [[ "$staging_sha" != "$TESTED_SHA" ]]; then
            echo "Staging advanced from $TESTED_SHA to $staging_sha; refusing to promote an untested commit."
            exit 1
          fi

      - name: Open or reuse staging promotion pull request
        id: promotion_pr
        run: |
          pr_number="$(gh pr list --repo "$REPOSITORY" --head staging --base main --state open --json number --jq '.[0].number')"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr create \
              --repo "$REPOSITORY" \
              --head staging \
              --base main \
              --title "Promote staging ${TESTED_SHA:0:12} to production" \
              --body "Automated promotion after the CI/CD workflow passed for commit ${TESTED_SHA}. Vercel deploys main to production through the linked Git integration.")"
            pr_number="${pr_number##*/}"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge promotion pull request
        run: |
          gh pr merge "${{ steps.promotion_pr.outputs.number }}" \
            --repo "$REPOSITORY" \
            --squash \
            --auto
