name: Promote staging to production

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [staging]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      promotion_sha:
        description: Exact staging commit SHA to re-check after protected approval
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  pull-requests: write

jobs:
  promote:
    name: Promote only a ready and approved staging commit
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging') ||
      (github.event_name == 'pull_request_review' &&
      github.event.pull_request.base.ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || inputs.promotion_sha }}
      PREVIEW_ISOLATION_CONFIRMED: ${{ vars.HANADI_PREVIEW_DATA_ISOLATION_CONFIRMED }}
    steps:
      - name: Require owner-confirmed Preview data isolation
        run: |
          if [[ "$PREVIEW_ISOLATION_CONFIRMED" != "true" ]]; then
            echo "Preview database and storage isolation has not been owner-confirmed; refusing promotion." >&2
            exit 1
          fi

      - name: Require an exact tested SHA
        run: |
          if [[ ! "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Promotion requires a 40-character tested staging SHA; refusing to continue." >&2
            exit 1
          fi

      - name: Confirm staging still points to the tested SHA
        run: |
          staging_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/staging" --jq '.object.sha')"
          if [[ "$staging_sha" != "$TESTED_SHA" ]]; then
            echo "Staging is $staging_sha, not the tested $TESTED_SHA; refusing to promote." >&2
            exit 1
          fi

      - name: Require successful exact-SHA CI
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${TESTED_SHA}&per_page=100")"
          ci_count="$(jq --arg sha "$TESTED_SHA" '[.workflow_runs[]? | select(.head_sha == $sha and .name == "CI/CD" and .status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
          if [[ "$ci_count" -lt 1 ]]; then
            echo "No successful completed CI/CD run exists for exact SHA $TESTED_SHA." >&2
            exit 1
          fi

      - name: Require successful exact-SHA Preview deployment
        id: staging_deployment
        run: |
          deployments="$(gh api --paginate "repos/${REPOSITORY}/deployments?sha=${TESTED_SHA}&per_page=100")"
          deployment_id="$(jq -r --arg sha "$TESTED_SHA" '([.[] | select(.sha == $sha and .ref == $sha and ((.environment // "") | ascii_downcase) == "preview")] | sort_by(.created_at) | last | .id) // empty' <<<"$deployments")"
          if [[ -z "$deployment_id" ]]; then
            echo "No Preview deployment exists for exact current staging SHA $TESTED_SHA; refusing to promote." >&2
            exit 1
          fi
          deployment_state="$(gh api "repos/${REPOSITORY}/deployments/${deployment_id}/statuses" --jq '.[0].state // empty')"
          if [[ "$deployment_state" != "success" ]]; then
            echo "Latest status for Preview deployment $deployment_id is ${deployment_state:-missing}; refusing to promote." >&2
            exit 1
          fi
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Require the latest exact-SHA staging readiness check
        run: |
          checks="$(gh api "repos/${REPOSITORY}/commits/${TESTED_SHA}/check-runs?per_page=100")"
          conclusion="$(jq -r --arg sha "$TESTED_SHA" '([.check_runs[] | select(.name == "Staging readiness" and .head_sha == $sha)] | sort_by(.completed_at // .started_at // .created_at) | last | .conclusion) // empty' <<<"$checks")"
          if [[ "$conclusion" != "success" ]]; then
            echo "The latest exact-SHA 'Staging readiness' check is ${conclusion:-missing}; refusing to promote." >&2
            exit 1
          fi

      - name: Require configured protected-review rules
        run: |
          protection="$(gh api "repos/${REPOSITORY}/branches/main/protection/required_pull_request_reviews" 2>/dev/null)" || {
            echo "Could not read main branch pull-request protection; refusing to assume approval rules." >&2
            exit 1
          }
          required_reviews="$(jq -r '.required_approving_review_count // 0' <<<"$protection")"
          if [[ "$required_reviews" -lt 1 ]]; then
            echo "main has no configured required pull-request review count; refusing to promote." >&2
            exit 1
          fi

      - name: Open or reuse a promotion pull request
        id: promotion_pr
        run: |
          comparison="$(gh api "repos/${REPOSITORY}/compare/main...staging")"
          ahead_by="$(jq -r '.ahead_by // 0' <<<"$comparison")"
          behind_by="$(jq -r '.behind_by // 0' <<<"$comparison")"
          if [[ "$behind_by" -gt 0 ]]; then
            echo "Staging is behind main; update staging and re-run exact-SHA readiness before promotion." >&2
            exit 1
          fi
          if [[ "$ahead_by" -eq 0 ]]; then
            echo "No staging-only commits exist; there is nothing to promote."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number="${{ github.event.pull_request.number }}"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr list --repo "$REPOSITORY" --head staging --base main --state open --json number --jq '.[0].number')"
          fi
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr create \
              --repo "$REPOSITORY" \
              --head staging \
              --base main \
              --title "Promote staging ${TESTED_SHA:0:12} to production" \
              --body "Promotion candidate for exact staging SHA ${TESTED_SHA}. Preview deployment ID: ${{ steps.staging_deployment.outputs.id }}. The protected main branch requires an explicit approved review before merge. Migration, rollback, backup, monitoring, and owner evidence remain separate release gates.")"
            pr_number="${pr_number##*/}"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge only after an explicit protected approval
        if: steps.promotion_pr.outputs.number != ''
        run: |
          decision="$(gh pr view "${{ steps.promotion_pr.outputs.number }}" --repo "$REPOSITORY" --json reviewDecision --jq '.reviewDecision')"
          if [[ "$decision" != "APPROVED" ]]; then
            echo "Promotion PR is not explicitly approved (decision: ${decision:-missing}); leaving it open and not merging."
            exit 0
          fi
          gh pr merge "${{ steps.promotion_pr.outputs.number }}" --repo "$REPOSITORY" --squash
